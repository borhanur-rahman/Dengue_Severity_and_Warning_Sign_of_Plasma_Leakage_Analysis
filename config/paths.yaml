project:
  name: Dengue_Project
  version: v2
raw_data:
  gse178240_counts: data/raw/GSE178240/GSE178240_all_counts.tsv
  gse215835_counts: data/raw/GSE215835/GSE215835_Dengue_RNAseq_counts.txt
  gse178240_series_base_url: https://ftp.ncbi.nlm.nih.gov/geo/series/GSE178nnn/GSE178240/matrix/
  gse178240_series:
    GPL16791: GSE178240-GPL16791_series_matrix.txt.gz
    GPL24676: GSE178240-GPL24676_series_matrix.txt.gz
platform_names:
  GPL16791: HiSeq2500
  GPL24676: NovaSeq6000
output:
  root: v2
  metadata_dir: v2/metadata
  processed_dir: v2/processed
  qc_dir: v2/qc
  series_dir: v2/raw_series
  runs_dir: v2/runs
  archive_previous_runs: true
axes:
  severity:
    dataset: GSE215835
    case: DHF
    control: DF
    cell_subtype: PBMC
    platform_aware: false
    discovery_platform: null
    validation_platform: null
  leakage:
    dataset: GSE178240
    case: D+W
    control: D-W
    cell_subtype: PBMC
    platform_aware: true
    discovery_platform: NovaSeq6000
    validation_platform: HiSeq2500
preprocessing:
  min_cpm: 1.0
  filter_mode: group_fraction
  min_group_fraction: 0.5
  min_samples: 5
  min_samples_floor: 5
  drop_pseudogenes: true
  unwanted_gene_exact:
  - MALAT1
  - NEAT1
  - XIST
  - HBA1
  - HBA2
  - HBB
  - HBD
  - HBG1
  - HBG2
  - HBE1
  - HBM
  - HBQ1
  - HBZ
  symbol_cleanup:
    mito_regex: ^MT-
    ribosomal_regex: ^RP[LS]\d
    ribosomal_spare_regex: ^RPS6K
    mito_ribosomal_regex: ^MRP[LS]\d
    globin:
    - HBA1
    - HBA2
    - HBB
    - HBD
    - HBG1
    - HBG2
    - HBM
    - HBQ1
    - HBZ
    - HBE1
rf:
  n_estimators: 500
  random_state: 0
  n_seed_fits: 50
  hvg_n: 2000
  top_n: 50
  external_validation: true
  nested_cv: true
  nested_outer_splits: 5
  nested_outer_repeats: 2
  nested_inner_splits: 5
  k_grid:
  - 30
  - 50
  - 75
  - 100
  - 150
  - 200
  n_estimators_by_axis:
    leakage: 500
    severity: 300
enrichment:
  go_library: GO_Biological_Process_2021
  kegg_library: KEGG_2021_Human
  padj: 0.05
  top_n: 50
  overlap_universe: intersection
ppi:
  axes:
  - leakage
  - severity
  string_min_score: 0.7
  cytohubba_method: MCC
target_genes:
- PARP8
- PARP9
- IFIT1
- IFI44L
- STAT1
- SMCHD1
- EGR1
- IFIH1
- EIF2AK2
reproducibility:
  seed: 0